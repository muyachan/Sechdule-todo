<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>個人行事曆／待辦事項管理工具</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📋</text></svg>" />
<!-- 快取破壞 (cache busting)：?v=N 版本參數。
     ⚠️ 每次修改 style.css / config.js / script.js 後，請把下方所有的 v=? 一起 +1，
        使用者的瀏覽器才會抓到最新版，而不是舊的快取檔。 -->
<link rel="stylesheet" href="style.css?v=9" />
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="app-header-row">
        <div>
          <h1>📋 我的待辦事項</h1>
          <p class="app-subtitle">個人行事曆／待辦事項管理工具</p>
        </div>
        <!-- 登入後才顯示的使用者資訊 + 登出 -->
        <div id="user-bar" class="user-bar" hidden>
          <span id="user-email" class="user-email"></span>
          <button type="button" id="logout-btn" class="btn btn-secondary btn-sm">登出</button>
        </div>
      </div>
    </header>

    <!-- ============ 登入 / 註冊畫面（未登入時顯示）============ -->
    <section id="auth-screen" class="panel auth-panel" hidden aria-labelledby="auth-heading">
      <h2 id="auth-heading" class="panel-title">登入</h2>
      <p class="panel-hint">請使用 email 與密碼登入，或註冊一個新帳號。</p>

      <form id="auth-form" class="auth-form">
        <div class="field">
          <label for="auth-email">Email</label>
          <input type="email" id="auth-email" name="email" placeholder="you@example.com" required autocomplete="email" />
        </div>
        <div class="field">
          <label for="auth-password">密碼</label>
          <input type="password" id="auth-password" name="password" placeholder="至少 6 個字元" required minlength="6" autocomplete="current-password" />
        </div>

        <div class="auth-actions">
          <button type="submit" id="login-btn" class="btn btn-primary">登入</button>
          <button type="button" id="signup-btn" class="btn btn-secondary">註冊</button>
        </div>
        <p id="auth-message" class="auth-message" role="alert" hidden></p>
      </form>
    </section>

    <!-- ============ 主應用程式（登入後才顯示）============ -->
    <main id="app-main" class="app-main" hidden>
      <!-- 分頁切換列：內容由 script.js 依 TABS 設定資料驅動產生，方便日後擴充。 -->
      <nav id="tab-bar" class="tab-bar" role="tablist" aria-label="功能分頁"></nav>

      <!-- AI 助理分頁（預設顯示）：完整聊天室版面 -->
      <section
        id="panel-chat"
        class="tab-panel chat-panel panel"
        role="tabpanel"
        aria-labelledby="tab-btn-chat"
      >
        <div class="chat-panel-head">
          <h2 class="panel-title">AI 行程規劃助理</h2>
          <p class="panel-hint">
            已串接 Claude API，助理會參考你目前的待辦事項，跟你討論與規劃行程。
          </p>
        </div>

        <div id="chat-messages" class="chat-messages" role="log" aria-live="polite"></div>

        <form id="chat-form" class="chat-form">
          <input
            type="text"
            id="chat-input"
            name="message"
            placeholder="輸入訊息，詢問 AI 關於你的行程安排..."
            autocomplete="off"
            maxlength="1000"
            required
          />
          <button type="submit" class="btn btn-primary">送出</button>
        </form>
      </section>

      <!-- 待辦事項分頁：功能維持不變 -->
      <section
        id="panel-todo"
        class="tab-panel panel"
        role="tabpanel"
        aria-labelledby="tab-btn-todo"
      >
        <h2 class="panel-title">待辦事項</h2>

        <form id="todo-form" class="todo-form">
          <div class="field">
            <label for="todo-title">事項名稱</label>
            <input
              type="text"
              id="todo-title"
              name="title"
              placeholder="輸入待辦事項..."
              required
              maxlength="200"
            />
          </div>
          <div class="field field-date">
            <label for="todo-due-date">截止日期</label>
            <input type="date" id="todo-due-date" name="dueDate" required />
          </div>
          <button type="submit" class="btn btn-primary">新增</button>
        </form>

        <p id="todo-loading" class="empty-state" hidden>載入中...</p>
        <ul id="todo-list" class="todo-list"></ul>
        <p id="todo-empty" class="empty-state" hidden>目前沒有待辦事項，新增一筆開始吧！</p>
      </section>
    </main>

    <footer class="app-footer">
      <p>資料儲存在 Supabase 雲端資料庫，可跨裝置存取（需登入）。</p>
    </footer>
  </div>

  <!-- Supabase JavaScript SDK（透過 CDN 引入，純前端網頁不使用 npm / 打包工具）-->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Markdown 渲染：marked 負責解析、DOMPurify 負責消毒 (XSS 防護)，用來渲染 AI 回覆。 -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
  <!-- ?v=N 版本參數：修改後請連同上方 style.css 一起更新版本號（見檔案開頭註解）。 -->
  <script src="config.js?v=9"></script>
  <script src="script.js?v=9"></script>
</body>
</html>
