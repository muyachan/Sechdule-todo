<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>個人行事曆／待辦事項管理工具</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📋</text></svg>" />

<!-- ============ PWA 設定：manifest + meta 標籤 + 圖示 ============ -->
<link rel="manifest" href="manifest.json?v=21" />
<meta name="theme-color" content="#2D2D2D" />
<!-- iOS Safari 不吃 manifest.json 的 display/name，需要另外用這些 meta 標籤設定
     「加入主畫面」後的全螢幕模式與名稱。 -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="我的行事曆" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />

<!-- 字體：Inter（英文/數字）+ Noto Sans TC（中文），透過 Google Fonts CDN 引入。 -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap"
  rel="stylesheet"
/>
<!-- 快取破壞 (cache busting)：?v=N 版本參數。
     ⚠️ 每次修改 style.css / config.js / script.js / manifest.json 後，
        請把下方所有的 v=? 一起 +1，使用者的瀏覽器才會抓到最新版，
        而不是舊的快取檔。（sw.js 本身不用加版本參數，它的快取版本
        由 sw.js 檔案內的 CACHE_NAME 常數控制，見該檔案開頭註解。）-->
<link rel="stylesheet" href="style.css?v=21" />
</head>
<body>
  <!-- ============ 啟動畫面（Splash）============
       預設就是可見狀態（不靠 JS 才顯示），這樣從主畫面開啟 PWA 時
       第一個 frame 就有畫面，不會先閃一下空白。資料/登入狀態就緒後
       由 script.js 淡出移除。 -->
  <div id="splash" class="splash">
    <img class="splash-icon" src="icons/icon-192.png" alt="" width="96" height="96" />
    <p class="splash-name">我的行事曆</p>
  </div>

  <div class="app-shell">
    <header class="app-header">
      <div class="app-header-row">
        <!-- 登入後才顯示：左上角選單鈕 + 使用者資訊。
             （登出已移到底部導航列，標題已移除。）
             ☰ 放在 #user-bar 內，沿用它的 hidden 屬性，
             未登入時就會一併隱藏，不需要另外控制。 -->
        <div id="user-bar" class="user-bar" hidden>
          <button
            type="button"
            id="drawer-toggle"
            class="icon-btn"
            aria-expanded="false"
            aria-controls="todo-drawer"
            aria-label="開啟選單"
            title="選單"
          >☰</button>
          <span id="user-email" class="user-email"></span>
        </div>
      </div>
    </header>

    <!-- ============ 登入 / 註冊畫面（未登入時顯示）============ -->
    <section id="auth-screen" class="panel auth-panel" hidden aria-labelledby="auth-heading">
      <h2 id="auth-heading" class="panel-title">登入</h2>
      <p class="panel-hint">請使用 email 與密碼登入，或註冊一個新帳號。</p>

      <form id="auth-form" class="auth-form">
        <div class="field">
          <label for="auth-email">Email</label>
          <input type="email" id="auth-email" name="email" placeholder="you@example.com" required autocomplete="email" tabindex="1" />
        </div>
        <div class="field">
          <label for="auth-password">密碼</label>
          <input type="password" id="auth-password" name="password" placeholder="至少 6 個字元" required minlength="6" autocomplete="current-password" tabindex="2" />
        </div>

        <div class="auth-actions">
          <button type="submit" id="login-btn" class="btn btn-primary" tabindex="3">登入</button>
          <button type="button" id="signup-btn" class="btn btn-secondary" tabindex="4">註冊</button>
        </div>
        <p id="auth-message" class="auth-message" role="alert" hidden></p>
      </form>
    </section>

    <!-- ============ 主應用程式（登入後才顯示）============ -->
    <main id="app-main" class="app-main" hidden>
      <!-- ============ 月曆主檢視 ============ -->
      <section id="calendar-view" class="calendar-view" aria-label="月曆">
        <div class="cal-nav">
          <button type="button" id="cal-prev" class="icon-btn" aria-label="上一個月">‹</button>
          <button
            type="button"
            id="cal-title"
            class="cal-title"
            aria-haspopup="true"
            aria-expanded="false"
            aria-controls="cal-jump"
          ></button>
          <button type="button" id="cal-next" class="icon-btn" aria-label="下一個月">›</button>
        </div>

        <!-- 快速跳轉：年 + 月下拉選單 -->
        <div id="cal-jump" class="cal-jump" hidden>
          <select id="cal-jump-year" aria-label="年份"></select>
          <select id="cal-jump-month" aria-label="月份"></select>
          <button type="button" id="cal-jump-today" class="btn btn-secondary btn-sm">今天</button>
        </div>

        <div class="cal-weekdays" aria-hidden="true">
          <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
        </div>

        <div id="cal-grid" class="cal-grid" role="grid" aria-label="日期"></div>

        <!-- 選中日期的待辦清單（常駐於月曆下方） -->
        <div class="day-section">
          <h2 id="day-title" class="day-title"></h2>
          <ul id="day-list" class="day-list"></ul>
          <p id="day-empty" class="day-empty" hidden>這天沒有待辦事項</p>

          <form id="day-add-form" class="day-add-form">
            <input
              type="text"
              id="day-add-title"
              placeholder="新增此日待辦..."
              required
              maxlength="200"
              autocomplete="off"
            />
            <button type="submit" class="btn btn-primary btn-sm">新增</button>
          </form>
        </div>
      </section>

      <!-- ============ 全部待辦：全螢幕檢視（與月曆互斥顯示）============
           內容就是原本抽屜裡那份完整列表，ID 全部沿用，因此
           renderTodoList() 這一路的重繪目標自動指向這裡，
           新增/編輯/刪除/打勾的既有邏輯完全不需修改。 -->
      <section id="todos-view" class="todos-view" aria-label="全部待辦事項">
        <h2 class="panel-title todos-view-title">全部待辦事項</h2>

        <form id="todo-form" class="todo-form">
          <div class="field">
            <label for="todo-title">事項名稱</label>
            <input
              type="text"
              id="todo-title"
              name="title"
              placeholder="輸入待辦事項..."
              required
              maxlength="200"
            />
          </div>
          <div class="field field-date">
            <label for="todo-due-date">截止日期</label>
            <input type="date" id="todo-due-date" name="dueDate" required />
          </div>
          <button type="submit" class="btn btn-primary">新增</button>
        </form>

        <p id="todo-loading" class="empty-state" hidden>載入中...</p>
        <ul id="todo-list" class="todo-list"></ul>
        <p id="todo-empty" class="empty-state" hidden>目前沒有待辦事項，新增一筆開始吧！</p>
      </section>

      <!-- ============ 側邊抽屜（全域元件）============
           待辦列表已移到上面的 #todos-view，這裡暫時是空狀態。
           開關／遮罩／ESC 關閉等行為維持不變。 -->
      <div id="drawer-backdrop" class="drawer-backdrop"></div>
      <aside
        id="todo-drawer"
        class="todo-drawer"
        role="dialog"
        aria-label="更多模組"
      >
        <div class="drawer-head drawer-head-end">
          <button type="button" id="drawer-close" class="icon-btn" aria-label="關閉選單">✕</button>
        </div>

        <p class="drawer-empty">更多模組開發中</p>
      </aside>

      <!-- ============ AI 助理：右下角浮動聊天泡泡（全域元件）============
           聊天視窗內容與 ID 都與改版前完全相同，因此所有既有聊天邏輯
           （Markdown 渲染、頭像、相對時間、複製、思考中、todosChanged 重抓）
           不需要任何修改就能沿用。 -->
      <button
        type="button"
        id="chat-fab"
        class="chat-fab"
        aria-expanded="false"
        aria-controls="chat-panel"
        aria-label="開啟 AI 助理"
      >💬</button>

      <div
        id="chat-panel"
        class="chat-panel"
        role="dialog"
        aria-label="AI 行程規劃助理"
      >
        <div class="chat-panel-head">
          <h2 class="panel-title">AI 行程規劃助理</h2>
          <p class="panel-hint">
            已串接 Claude API，助理會參考你目前的待辦事項，跟你討論與規劃行程。
          </p>
        </div>

        <div id="chat-messages" class="chat-messages" role="log" aria-live="polite"></div>

        <!-- 輸入中指示器：固定在輸入框正上方，等待 AI 回覆時顯示。 -->
        <div id="chat-typing" class="chat-typing" role="status" aria-live="polite" hidden>
          <span class="chat-typing-text">輸入中</span>
          <span class="chat-typing-dots" aria-hidden="true">
            <span class="chat-typing-dot"></span>
            <span class="chat-typing-dot"></span>
            <span class="chat-typing-dot"></span>
          </span>
        </div>

        <form id="chat-form" class="chat-form">
          <textarea
            id="chat-input"
            name="message"
            placeholder="輸入訊息，詢問 AI 關於你的行程安排..."
            autocomplete="off"
            maxlength="1000"
            rows="1"
            required
          ></textarea>
          <button type="submit" class="btn btn-primary">送出</button>
        </form>
      </div>

      <!-- ============ 底部導航列（全域元件）============
           五等分格子，只有圖示沒有文字。前三格切換畫面（有選取狀態），
           後兩格是動作（無選取狀態），中間以細分隔線分區。
           圖示皆為 inline SVG（Tabler Icons outline, MIT），
           stroke 使用 currentColor，不引入任何圖示字型或 CDN。 -->
      <nav id="bottom-nav" class="bottom-nav" aria-label="主導航">
        <button
          type="button"
          id="nav-calendar"
          class="bottom-nav-btn is-active"
          data-nav="calendar"
          aria-label="行事曆"
          title="行事曆"
        >
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 7a2 2 0 0 1 2 -2h12a2 2 0 0 1 2 2v12a2 2 0 0 1 -2 2h-12a2 2 0 0 1 -2 -2v-12z" />
            <path d="M16 3v4" />
            <path d="M8 3v4" />
            <path d="M4 11h16" />
            <path d="M9 15l2 2l4 -4" />
          </svg>
        </button>

        <button
          type="button"
          id="nav-notes"
          class="bottom-nav-btn"
          data-nav="notes"
          aria-label="備忘錄"
          title="備忘錄"
        >
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M6 4h11a2 2 0 0 1 2 2v12a2 2 0 0 1 -2 2h-11a1 1 0 0 1 -1 -1v-14a1 1 0 0 1 1 -1m3 0v18" />
            <path d="M13 8l2 0" />
            <path d="M13 12l2 0" />
          </svg>
        </button>

        <button
          type="button"
          id="nav-todos"
          class="bottom-nav-btn"
          data-nav="todos"
          aria-label="全部待辦"
          title="全部待辦"
        >
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M9 6l11 0" />
            <path d="M9 12l11 0" />
            <path d="M9 18l11 0" />
            <path d="M5 6l0 .01" />
            <path d="M5 12l0 .01" />
            <path d="M5 18l0 .01" />
          </svg>
        </button>

        <!-- 分隔線由第 4 格的 ::before 畫出，保持五格等寬 -->
        <button
          type="button"
          id="nav-dark"
          class="bottom-nav-btn bottom-nav-group-start"
          aria-label="夜間模式"
          title="夜間模式"
        >
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 3c.132 0 .263 0 .393 0a7.5 7.5 0 0 0 7.92 12.446a9 9 0 1 1 -8.313 -12.454z" />
          </svg>
        </button>

        <button
          type="button"
          id="nav-logout"
          class="bottom-nav-btn"
          aria-label="登出"
          title="登出"
        >
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M14 8v-2a2 2 0 0 0 -2 -2h-7a2 2 0 0 0 -2 2v12a2 2 0 0 0 2 2h7a2 2 0 0 0 2 -2v-2" />
            <path d="M9 12h12l-3 -3" />
            <path d="M18 15l3 -3" />
          </svg>
        </button>
      </nav>

      <!-- 佔位功能的簡易提示條 -->
      <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    </main>

    <footer class="app-footer">
      <p>資料儲存在 Supabase 雲端資料庫，可跨裝置存取（需登入）。</p>
    </footer>
  </div>

  <!-- Supabase JavaScript SDK（透過 CDN 引入，純前端網頁不使用 npm / 打包工具）-->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Markdown 渲染：marked 負責解析、DOMPurify 負責消毒 (XSS 防護)，用來渲染 AI 回覆。 -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
  <!-- ?v=N 版本參數：修改後請連同上方 style.css 一起更新版本號（見檔案開頭註解）。 -->
  <script src="config.js?v=21"></script>
  <script src="script.js?v=21"></script>

  <!-- 註冊 Service Worker（見 sw.js）：提供基本的 App Shell 快取，
       讓 PWA 開啟更快、離線時至少能顯示介面外殼。與待辦/聊天等
       既有功能邏輯無關，獨立於 script.js 之外。 -->
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker
          .register("sw.js")
          .catch((err) => console.warn("Service Worker 註冊失敗：", err));
      });
    }
  </script>
</body>
</html>
